<section class="form-section">

<div class="container">

<div class="form-box">

<!-- ============================================
     DANNET ISP SYSTEM
     FORM PASANG BARU
============================================ -->

<form id="pasangBaruForm">

    <!-- ========================================
         DATA PELANGGAN
    ========================================= -->

    <div class="form-row">

        <div class="form-group">

            <label for="nama">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Masukkan nama lengkap"
                autocomplete="name"
                required>

        </div>


        <div class="form-group">

            <label for="whatsapp">
                Nomor WhatsApp
            </label>

            <input
                type="tel"
                id="whatsapp"
                name="whatsapp"
                placeholder="08xxxxxxxxxx"
                autocomplete="tel"
                required>

        </div>

    </div>


    <!-- ========================================
         EMAIL
    ========================================= -->

    <div class="form-group">

        <label for="email">
            Email
            <span class="optional">
                (Opsional)
            </span>
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="contoh@email.com"
            autocomplete="email">

    </div>


    <!-- ========================================
         ALAMAT
    ========================================= -->

    <div class="form-group">

        <label for="alamat">
            Alamat Lengkap
        </label>

        <textarea
            id="alamat"
            name="alamat"
            rows="4"
            placeholder="Masukkan alamat lengkap rumah"
            required></textarea>

    </div>


    <!-- ========================================
         WILAYAH
    ========================================= -->

    <div class="form-row">

        <div class="form-group">

            <label for="desa">
                Desa / Kelurahan
            </label>

            <input
                type="text"
                id="desa"
                name="desa"
                placeholder="Desa / Kelurahan">

        </div>


        <div class="form-group">

            <label for="kecamatan">
                Kecamatan
            </label>

            <input
                type="text"
                id="kecamatan"
                name="kecamatan"
                placeholder="Kecamatan">

        </div>

    </div>


    <!-- ========================================
         GOOGLE MAPS
    ========================================= -->

    <div class="form-group">

        <label for="maps">
            Link Lokasi Google Maps
        </label>

        <input
            type="url"
            id="maps"
            name="maps"
            placeholder="https://maps.google.com/...">

        <small class="form-help">
            Silakan masukkan link lokasi rumah dari Google Maps.
        </small>

    </div>


    <!-- ========================================
         PAKET DAN TANGGAL
    ========================================= -->

    <div class="form-row">

        <div class="form-group">

            <label for="paket">
                Pilih Paket Internet
            </label>

            <select
                id="paket"
                name="paket"
                required>

                <option value="">
                    Memuat paket internet...
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="tanggal">
                Tanggal Pemasangan
            </label>

            <input
                type="date"
                id="tanggal"
                name="tanggal">

        </div>

    </div>


    <!-- ========================================
         CATATAN
    ========================================= -->

    <div class="form-group">

        <label for="catatan">
            Catatan
        </label>

        <textarea
            id="catatan"
            name="catatan"
            rows="4"
            placeholder="Contoh: Rumah pagar hijau, dekat masjid..."></textarea>

    </div>


    <!-- ========================================
         PERSETUJUAN
    ========================================= -->

    <div class="form-group">

        <label class="checkbox-label">

            <input
                type="checkbox"
                id="persetujuan"
                name="persetujuan"
                required>

            <span>
                Saya menyetujui data ini digunakan
                untuk proses pemasangan layanan DANNET.
            </span>

        </label>

    </div>


    <!-- ========================================
         SUBMIT
    ========================================= -->

    <button
        type="submit"
        class="btn btn-primary"
        id="btnSubmitPasangBaru">

        Kirim Permohonan

    </button>


</form>
