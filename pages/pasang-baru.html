<span>DANNET</span>

<h2>Form Pasang Baru</h2>

<p>

Silakan isi data berikut.

Tim kami akan menghubungi Anda.

</p>

</div>

</div>

<section class="form-section">

<div class="container">

<div class="form-box">

<form id="formPasangBaru">

    <div class="form-row">

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" required>
        </div>

        <div class="form-group">
            <label>Nomor WhatsApp</label>
            <input type="tel" name="whatsapp" required>
        </div>

    </div>

    <div class="form-group">
        <label>Email (Opsional)</label>
        <input type="email" name="email">
    </div>

    <div class="form-group">
        <label>Alamat Lengkap</label>
        <textarea name="alamat" required></textarea>
    </div>

    <div class="form-row">

        <div class="form-group">
            <label>Desa / Kelurahan</label>
            <input type="text" name="desa">
        </div>

        <div class="form-group">
            <label>Kecamatan</label>
            <input type="text" name="kecamatan">
        </div>

    </div>

    <div class="form-group">
        <label>Link Lokasi Google Maps</label>
        <input
            type="url"
            name="maps"
            placeholder="https://maps.google.com/...">
    </div>

    <div class="form-row">

        <div class="form-group">

            <label>Pilih Paket</label>

            <select name="paket">

                <option>20 Mbps</option>

                <option>30 Mbps</option>

                <option>50 Mbps</option>

            </select>

        </div>

        <div class="form-group">

            <label>Tanggal Pemasangan</label>

            <input type="date" name="tanggal">

        </div>

    </div>

    <div class="form-group">

        <label>Catatan</label>

        <textarea
            name="catatan"
            placeholder="Contoh: Rumah pagar hijau, dekat masjid..."></textarea>

    </div>

    <div class="form-group">

        <label class="checkbox-label">

            <input type="checkbox" required>

            <span>
            Saya menyetujui data ini digunakan untuk proses pemasangan.
            </span>

        </label>

    </div>

    <button class="btn btn-primary" type="submit">

        Kirim Permohonan

    </button>

</form>

</div>

</div>

</section>
